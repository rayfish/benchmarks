[package]
name = "rayfish-benchmarks"
version = "0.1.0"
edition = "2024"
publish = false
license = "MPL-2.0"

[dev-dependencies]
arc-swap = "1.9.1"
blake3 = "1"
bytes = "1"
criterion = "0.5"
iroh = "1.3"
libc = "0.2"
rayfish = { git = "https://github.com/rayfish/rayfish", rev = "5ccff7d5562d283c0c0d9ab814c2fbf38ed92410" }
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }

[[bench]]
name = "forward"
harness = false

[[bench]]
name = "apple_bridge"
harness = false

[patch.crates-io]
noq-udp = { git = "https://github.com/rayfish/noq", rev = "e79859505f58628ce1e7d3403c264611dd0bccde" }
iroh = { git = "https://github.com/rayfish/iroh", rev = "5cb8add0b31a5e05a2a00ce4b1afd7e5245122e0" }
iroh-base = { git = "https://github.com/rayfish/iroh", rev = "5cb8add0b31a5e05a2a00ce4b1afd7e5245122e0" }
iroh-dns = { git = "https://github.com/rayfish/iroh", rev = "5cb8add0b31a5e05a2a00ce4b1afd7e5245122e0" }
iroh-relay = { git = "https://github.com/rayfish/iroh", rev = "5cb8add0b31a5e05a2a00ce4b1afd7e5245122e0" }
netdev = { git = "https://github.com/extrowerk/netdev.git", branch = "illumos" }
netwatch = { git = "https://github.com/extrowerk/net-tools", branch = "illumos-0.19" }
